# ============================================================
# EJEMPLO de como quedaria el Secret de credenciales.
# Este archivo SI se versiona (no tiene valores reales).
#
# El Secret REAL se crea una sola vez en el cluster y NO se sube al repo:
#   kubectl create secret generic coffeesecret-supabase \
#     --from-literal=SUPABASE_URL="https://<tu-proyecto>.supabase.co" \
#     --from-literal=SUPABASE_SERVICE_KEY="<pegar aqui la service key>" \
#     -n student-cdarwitg
#
# Este manifiesto es solo la estructura de referencia. Los deployments lo
# referencian asi:
#   envFrom:
#   - secretRef:
#       name: coffeesecret-supabase
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: coffeesecret-supabase
  namespace: student-cdarwitg
  labels:
    app: coffeesecret
type: Opaque
stringData:
  SUPABASE_URL: "<TU_SUPABASE_URL>"
  SUPABASE_SERVICE_KEY: "<TU_SUPABASE_SERVICE_KEY>"