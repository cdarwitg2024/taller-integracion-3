# MS-Pedidos (backend-node) actualizado a v1.0.3.
# Cambios: ya no monta /api/inventario (pasó a su propio microservicio) y
# desacopla el stock por HTTP hacia el Servicio "inventario-service".
# Aplicar SOLO con kubectl set image si ya existe el deployment:
#   kubectl set image deployment/backend-node backend-node=cdarwitg2024/backend-node:v1.0.3 -n student-cdarwitg
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-node
  namespace: student-cdarwitg
  labels:
    app: backend-node
    ms: pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-node
  template:
    metadata:
      labels:
        app: backend-node
        ms: pedidos
    spec:
      containers:
      - name: backend-node
        image: cdarwitg2024/backend-node:v1.0.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: coffeesecret-supabase
        env:
        - name: PORT
          value: "3000"
        - name: INVENTARIO_SERVICE_URL
          value: "http://inventario-service"
        resources:
          requests:
            cpu: 125m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15