apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-service
  namespace: student-cdarwitg
  labels:
    app: inventario-service
    ms: inventario
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-service
  template:
    metadata:
      labels:
        app: inventario-service
        ms: inventario
    spec:
      containers:
      - name: inventario-service
        image: cdarwitg2024/inventario-service:v1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: coffeesecret-supabase
        env:
        - name: PORT
          value: "3001"
        resources:
          requests:
            cpu: 125m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 15