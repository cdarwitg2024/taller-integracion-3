services:
  bot-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffeefaster_bot_telegram
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DB_HOST=supabase_db_db_CoffeeFaster
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - supabase_network_db_CoffeeFaster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    driver: bridge
  supabase_network_db_CoffeeFaster:
    external: true
