# ============================================================================
# nginx.conf del gateway para el entorno LOCAL (Docker Compose).
# Se monta en /etc/nginx/conf.d/default.conf (config de tipo server{}).
# En el cluster se usa k8s-next/gateway/nginx.conf (la config principal con el
# DNS del cluster); ESTE archivo es solo para compose, con los nombres de
# servicio de docker-compose (ms-cafeterias, ms-menus, ms-pedidos, sin el
# sufijo .svc.cluster.local) y proxy_pass estatico (sin resolver).
# ============================================================================
server {
  listen 80;
  server_name _;

  location = /gateway/health {
    return 200 'gateway ok\n';
    add_header Content-Type text/plain;
  }

  location ~ ^/api/menus/precios/?$ {
    return 404;
  }
  location ~ ^/api/inventario(/|$) {
    return 404;
  }

  location /api/cafeterias {
    proxy_pass http://ms-cafeterias:3002$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/menus {
    proxy_pass http://ms-menus:3003$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/pedidos {
    proxy_pass http://ms-pedidos:3005$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 404;
  }
}