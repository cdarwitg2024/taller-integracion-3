# Gateway de CoffeeFast.

upstream ms_cafeterias {
    server ms-cafeterias:3002;
}

upstream ms_menus {
    server ms-menus:3003;
}

upstream ms_inventario {
    server ms-inventario:3004;
}

upstream ms_pedidos {
    server ms-pedidos:3005;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # -- ms-cafeterias ------------------------------------------------------
    location /api/cafeterias {
        proxy_pass http://ms_cafeterias;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_send_timeout    3s;
    }

    # -- ms-inventario: bloqueado en gateway (404) ----------------------------
    location ~ ^/api/inventario(/|$) {
        default_type application/json;
        return 404 '{"error":"Ruta no expuesta por el gateway","gateway":"coffee-fast-gateway","motivo":"ms-inventario es interno"}';
    }

    location ~ ^/api/menus/precios/?$ {
        default_type application/json;
        return 404 '{"error":"Ruta no expuesta por el gateway","gateway":"coffee-fast-gateway","motivo":"ruta interna de ms-menus, solo ms-pedidos"}';
    }

    # -- ms-menus ------------------------------------------------------------
    location /api/menus {
        proxy_pass http://ms_menus;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_send_timeout    3s;
    }

    # -- ms-pedidos -----------------------------------------------------------
    location /api/pedidos {
        proxy_pass http://ms_pedidos;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_send_timeout    3s;
    }

    location = /gateway/health {
        access_log off;
        return 200 "gateway ok\n";
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Ruta no expuesta por el gateway","gateway":"coffee-fast-gateway"}';
    }
}
