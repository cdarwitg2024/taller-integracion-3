# Gateway (nginx) del entorno local de Docker Compose.
#
# Se monta en /etc/nginx/conf.d/default.conf, por eso va SIN el bloque http{}:
# el nginx.conf base de la imagen ya lo incluye dentro de http. El equivalente
# de Kubernetes es k8s-next/gateway/nginx.conf (ese si va completo, porque se
# monta como /etc/nginx/nginx.conf via ConfigMap).
#
# Rutas publicas: /api/cafeterias, /api/menus y /api/pedidos. Todo lo demas
# responde 404. La ruta interna POST /api/menus/precios (ms-pedidos -> ms-menus)
# queda bloqueada a proposito.

server {
  listen 80;
  server_name _;

  location = /gateway/health {
    return 200 'gateway ok\n';
    add_header Content-Type text/plain;
  }

  location ~ ^/api/menus/precios/?$ {
    return 404;
  }

  location /api/cafeterias {
    proxy_pass http://ms-cafeterias:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/menus {
    proxy_pass http://ms-menus:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/pedidos {
    proxy_pass http://ms-pedidos:3005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 404;
  }
}