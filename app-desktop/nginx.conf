# SPA del frontend web. La app usa HashRouter, pero try_files cubre cualquier
# deep-link si en el futuro se cambia a BrowserRouter.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|html)$ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }
}