# ms-cafeterias — Service interno.
#
# ClusterIP: el unico que lo consume es el gateway. Exponerlo por Ingress
# saltaria el gateway y dejaria el servicio accesible desde internet.
#
# `port` es el PUERTO DEL CONTENEDOR (3002), no 80, porque el gateway lo llama
# por DNS con ese numero (`upstream ms_cafeterias { server ms-cafeterias:3002; }`
# en services/gateway/nginx.conf). Con `port: 80` el Service no escucha en 3002
# y el gateway da502. Mismo contrato que el compose local.
apiVersion: v1
kind: Service
metadata:
  name: ms-cafeterias
  namespace: student-cdarwitg
  labels:
    app: ms-cafeterias
    ms: cafeterias
spec:
  type: ClusterIP
  selector:
    app: ms-cafeterias
  ports:
    - name: http
      port: 3002
      targetPort: http   # -> 3002
      protocol: TCP