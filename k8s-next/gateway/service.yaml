# Service interno gateway:80. El Ingress apunta a este Service,
# y selector.app debe seleccionar los Pods del Deployment gateway.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: student-cdarwitg
  labels:
    app: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: gateway
