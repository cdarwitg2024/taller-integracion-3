# Gateway Nginx: recibe tráfico del Service gateway y lo enruta por /api/.
# La configuración procede del ConfigMap; la imagen de Nginx no contiene
# el código de Node ni confirma la versión desplegada de los microservicios.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: student-cdarwitg
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  # Con una réplica y maxSurge=0 puede haber interrupción durante el rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Usuario Linux 101 y grupo del volumen; conservar permisos de los mounts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # subPath monta solo nginx.conf. Cambiar el ConfigMap no recarga
          # automáticamente este archivo ni el proceso Nginx: revisar el rollout.
          # Cache y PID se escriben en emptyDir con la raíz en solo lectura.
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          # CPU limitada mediante throttling; el límite de memoria puede causar OOM.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          # Salud del proceso Nginx, sin probar los upstream ni Supabase.
          readinessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      volumes:
        - name: config
          configMap:
            name: gateway-nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
