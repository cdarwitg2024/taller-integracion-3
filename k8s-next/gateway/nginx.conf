worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;

  resolver 10.43.40.162 valid=5s ipv6=off;

  server {
    listen 80;
    server_name _;

    location /gateway/health {
      return 200 'gateway ok\n';
      add_header Content-Type text/plain;
    }

    location ~ ^/api/menus/precios/?$ {
      return 404;
    }
    location ~ ^/api/inventario(/|$) {
      return 404;
    }

    location /api/cafeterias {
      set $up_caf http://ms-cafeterias.student-cdarwitg.svc.cluster.local:3002;
      proxy_pass $up_caf$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/menus {
      set $up_menus http://ms-menus.student-cdarwitg.svc.cluster.local:3003;
      proxy_pass $up_menus$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/pedidos {
      set $up_ped http://ms-pedidos.student-cdarwitg.svc.cluster.local:3005;
      proxy_pass $up_ped$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}