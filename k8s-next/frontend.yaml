apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: student-cdarwitg
  labels:
    app: frontend-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      containers:
        - name: frontend-web
          image: cdarwitg2024/frontend-web:v1.0.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: student-cdarwitg
  labels:
    app: frontend-web
spec:
  type: ClusterIP
  selector:
    app: frontend-web
  ports:
    - name: http
      port: 80
      targetPort: http