# ms-menus: dirección estable dentro del namespace student-cdarwitg.
# selector.app debe coincidir con las etiquetas del Pod; port es el puerto
# del Service y targetPort debe resolver al puerto HTTP del contenedor.
# ClusterIP no publica el servicio en Internet: el acceso exterior pasa por gateway.
apiVersion: v1
kind: Service
metadata:
  name: ms-menus
  namespace: student-cdarwitg
  labels:
    app: ms-menus
    ms: menus
spec:
  type: ClusterIP
  selector:
    app: ms-menus
  ports:
    - name: http
      port: 3003
      targetPort: http
      protocol: TCP
