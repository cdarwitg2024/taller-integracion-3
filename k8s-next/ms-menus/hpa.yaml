# ms-menus — Horizontal Pod Autoscaler (basado en utilización de CPU).
#
# HPA mínimo y explicable para ms-menus. Requiere:
#   1. Metrics API (metrics.k8s.io) operativa en el clúster;
#   2. que el contenedor declare requests.cpu (actualmente 50m), que es la
#      base del cálculo de "Utilization" (uso_actual / requests.cpu).
#
# Este manifiesto vive en k8s-next/ a proposito, junto a deployment.yaml y
# service.yaml (la arboleria k8s/ es la vieja, con backend-node).
#
# Nota: NO se define "behavior" ni métricas de memoria todavia. Se empieza
# con un HPA mínimo para poder demostrarlo y validar la obtención de métricas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-menus
  namespace: student-cdarwitg
  labels:
    app: ms-menus
    ms: menus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-menus
  minReplicas: 1
  # maxReplicas: 2 por análisis global de ResourceQuota (ver
  # docs/kubernetes/configuracion-hpa-microservicios.md). Con los 3 MS a max 2
  # + 3 Pods fijos el namespace llega a 9/12 Pods, conservando margen.
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
