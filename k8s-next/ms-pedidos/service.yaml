# /health y /api/pedidos/health son públicos; las operaciones de pedidos exigen JWT.
# ms-pedidos: dirección estable dentro del namespace student-cdarwitg.
# selector.app debe coincidir con las etiquetas del Pod; port es el puerto
# del Service y targetPort debe resolver al puerto HTTP del contenedor.
# ClusterIP no publica el servicio en Internet: el acceso exterior pasa por gateway.
apiVersion: v1
kind: Service
metadata:
  name: ms-pedidos
  namespace: student-cdarwitg
  labels:
    app: ms-pedidos
    ms: pedidos
spec:
  type: ClusterIP
  selector:
    app: ms-pedidos
  ports:
    - name: http
      port: 3005
      targetPort: http
      protocol: TCP
