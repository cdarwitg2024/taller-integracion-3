# ms-pedidos — Horizontal Pod Autoscaler basado en CPU.
#
# El HPA utiliza la métrica de CPU de los Pods y calcula la utilización
# respecto de requests.cpu del contenedor (actualmente 50m).
#
# Requiere que Metrics API (metrics.k8s.io) esté disponible en el clúster.
#
# El servicio mantiene un mínimo de 1 Pod y puede escalar hasta un máximo
# de 3 Pods totales según la utilización de CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-pedidos
  namespace: student-cdarwitg
  labels:
    app: ms-pedidos
    ms: pedidos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-pedidos
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
