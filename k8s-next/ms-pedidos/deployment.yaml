# ms-pedidos: Deployment del stack de microservicios (no del backend legacy).
# Mantiene los valores operativos de la versión actual de Git.
# El Service y el gateway deben apuntar al mismo puerto declarado abajo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pedidos
  namespace: student-cdarwitg
  labels:
    app: ms-pedidos
    ms: pedidos
spec:
  # Valor inicial; con el HPA activo las réplicas las administra el autoscaler.
  replicas: 1

  selector:
    matchLabels:
      app: ms-pedidos

  # Evita un Pod adicional durante el rollout; con una réplica puede haber
  # interrupción de servicio. La CPU y la memoria disponibles las limita la cuota.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: ms-pedidos
        ms: pedidos
    spec:

      # UID del proceso Linux, independiente del rol del usuario en Supabase.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: ms-pedidos
          image: cdarwitg2024/ms-pedidos:v1.0.3
          # Usa la imagen local si existe; si falta intenta descargarla.
          # Reutilizar un tag no garantiza que se ejecute el código recién construido.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3005

          # Los valores sensibles provienen del Secret existente, no de este YAML.
          env:
            - name: PORT
              value: '3005'
            - name: NODE_ENV
              value: 'production'
            - name: MS_MENUS_URL
              value: 'http://ms-menus:3003'
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coffeesecret-supabase
                  key: SUPABASE_URL

            # Crear/cancelar pedidos invoca las RPC con esta clave y el JWT real
            # del usuario; no se utiliza service_role para simular su identidad.
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: coffeesecret-supabase
                  key: SUPABASE_PUBLISHABLE_KEY
            # Cliente servidor compartido: las lecturas requieren controles de negocio
            # en Node. No equivale a una sesión autenticada del estudiante.
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: coffeesecret-supabase
                  key: SUPABASE_SERVICE_KEY

          # requests.cpu es la base del HPA. El límite de CPU puede producir
          # throttling; superar memoria puede producir OOMKilled.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi

          # /health comprueba el proceso HTTP; no valida Supabase ni las RPC.
          # Readiness retira tráfico; liveness puede reiniciar el contenedor.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']

          # /tmp sigue siendo escribible con la raíz del contenedor en solo lectura.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      # Plazo para el cierre tras SIGTERM antes de una terminación forzada.
      # server.js atiende SIGTERM; esto no garantiza que el cliente reciba el pago.
      terminationGracePeriodSeconds: 15
