name: CI Functional
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix Microservices/ms-menus
      - run: npm ci --prefix Microservices/ms-cafeterias
      - run: ln -s ../ms-menus/node_modules Microservices/shared/node_modules
      - name: HTTP APIs through real PostgREST and PostgreSQL
        run: node .github/scripts/test-catalog-integration.cjs
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cf_bot_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: BotTelegramCoffeFaster
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cf_bot_test_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name cf-test-postgres -e POSTGRES_HOST_AUTH_METHOD=trust postgres:15
          # El servidor temporal de inicialización solo escucha por socket.
          # Esperar TCP evita continuar antes de que arranque el servidor final.
          for attempt in $(seq 1 30); do
            if docker exec cf-test-postgres pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec cf-test-postgres psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
      - name: Real payment, rollback, stock and concurrent cancellation
        env:
          TEST_POSTGRES_CONTAINER: cf-test-postgres
        run: node app-mobile/tabla_mobile/tests/run-procesar-pago.cjs
      - name: Verify tests detect deliberately broken payment and refund code
        env:
          TEST_POSTGRES_CONTAINER: cf-test-postgres
        run: node .github/scripts/verify-test-sensitivity.cjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Diego24Vas/db_CoffeeFaster
          ref: d074ed56aaf3e9c3992b8852a052f9f76d86f5cc
          path: .test-bd
          persist-credentials: false
      - name: Migration limitar beneficio por comprador y código over V07, V08 and V09
        env:
          TEST_POSTGRES_CONTAINER: cf-test-postgres
          DB_COFFEEFASTER_DIR: ${{ github.workspace }}/.test-bd
        run: node database/tests/prueba_limitar_beneficio_por_comprador_y_codigo.cjs
      - name: Remove isolated database container
        if: always()
        run: docker rm -f cf-test-postgres
  afiliados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name cf-afiliados-pg -e POSTGRES_PASSWORD=test -v "$PWD:/repo" postgres:15
          for attempt in $(seq 1 30); do
            if docker exec cf-afiliados-pg pg_isready -U postgres; then break; fi
            sleep 1
          done
      - name: Campaign administration SQL, V05 trigger, versioning and acceptance
        run: docker exec -w /repo cf-afiliados-pg psql -U postgres -v ON_ERROR_STOP=1 -f database/fixes/prueba_administrar_campanas_afiliados.sql
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm -f cf-afiliados-pg
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --runInBand
      - name: Verify tests detect an incorrect initial order state
        run: node ../.github/scripts/verify-unit-sensitivity.cjs backend
  afiliados-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix Microservices/ms-afiliados
      - run: ln -s ../ms-afiliados/node_modules Microservices/shared/node_modules
      - name: C03 through gateway, real Auth JWTs, PostgREST, RPC and RLS
        env:
          TEST_AUTH_IMAGE: supabase/gotrue:v2.197.0
          TEST_REST_IMAGE: postgrest/postgrest:v16.3
        run: node .github/scripts/test-afiliados-auth-integration.cjs
  mobile-afiliaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Diego24Vas/db_CoffeeFaster
          ref: 80bbc91ebf7766d849332d2a73b02b0f7265568f
          path: .test-bd
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run database migration and regression suites, including C09
        working-directory: .test-bd
        env:
          TEST_POSTGRES_CONTAINER: cf-db-suite-pg
        run: |
          docker run --rm -d --name "$TEST_POSTGRES_CONTAINER" \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          trap 'docker stop "$TEST_POSTGRES_CONTAINER" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$TEST_POSTGRES_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then
              npm test && COFFEEFAST_DB_REPO="$PWD" node ../.github/scripts/test-segunda-validacion-retiro-c09.cjs
              exit $?
            fi
            sleep 1
          done

          docker logs "$TEST_POSTGRES_CONTAINER"
          exit 1
      - run: npm ci --prefix Microservices/ms-pedidos
      - run: npm ci --prefix Microservices/ms-cafeterias
      - run: npm ci --prefix Microservices/ms-afiliados
      - run: ln -s ../ms-pedidos/node_modules Microservices/shared/node_modules
      - run: npm ci --prefix app-mobile
      - name: A05, A06, A10, A12, A13, C05 and C15 through gateway, real Auth JWTs, PostgreSQL and RLS
        env:
          COFFEEFAST_DB_MIGRATIONS: ${{ github.workspace }}/.test-bd/supabase/migrations
          TEST_AUTH_IMAGE: supabase/gotrue:v2.197.0
          TEST_REST_IMAGE: postgrest/postgrest:v16.3
        run: node .github/scripts/test-afiliados-auth-integration.cjs --a06
