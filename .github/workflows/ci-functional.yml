name: CI Functional
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix Microservices/ms-menus
      - run: npm ci --prefix Microservices/ms-cafeterias
      - run: ln -s ../ms-menus/node_modules Microservices/shared/node_modules
      - name: HTTP APIs through real PostgREST and PostgreSQL
        run: node .github/scripts/test-catalog-integration.cjs
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cf_bot_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: BotTelegramCoffeFaster
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cf_bot_test_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name cf-test-postgres -e POSTGRES_HOST_AUTH_METHOD=trust postgres:15
          for attempt in $(seq 1 30); do
            if docker exec cf-test-postgres pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec cf-test-postgres psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
      - name: Real payment, rollback, stock and concurrent cancellation
        env:
          TEST_POSTGRES_CONTAINER: cf-test-postgres
        run: node app-mobile/tabla_mobile/tests/run-procesar-pago.cjs
      - name: Verify tests detect deliberately broken payment and refund code
        env:
          TEST_POSTGRES_CONTAINER: cf-test-postgres
        run: node .github/scripts/verify-test-sensitivity.cjs
      - name: Remove isolated database container
        if: always()
        run: docker rm -f cf-test-postgres
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --runInBand
      - name: Verify tests detect an incorrect initial order state
        run: node ../.github/scripts/verify-unit-sensitivity.cjs backend
